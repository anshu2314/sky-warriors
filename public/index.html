<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Fighter Game - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        #background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        #moving-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            height: auto;
            animation: moveAndRotate 15s linear infinite;
            transform-origin: center center;
        }

        @keyframes moveAndRotate {
            0% {
                transform: translate(-50%, -50%) scaleX(1);
            }
            49% {
                transform: translate(-150%, -50%) scaleX(1);
            }
            50% {
                transform: translate(-150%, -50%) scaleX(-1);
            }
            99% {
                transform: translate(-50%, -50%) scaleX(-1);
            }
            100% {
                transform: translate(-50%, -50%) scaleX(1);
            }
        }

        .login-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            backdrop-filter: blur(5px);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin: 0 0 1.5rem 0;
            color: #fff;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background: #4CAF50;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #45a049;
        }

        /* Mobile optimization */
        @media (max-width: 768px) {
            #moving-background {
                width: 150%;
                background-size: cover;
            }
            
            .login-container {
                padding: 1.5rem;
                width: 85%;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="background-container">
        <img src="uff.jpg" id="moving-background" alt="">
    </div>

    <div class="login-container">
        <h1>Jet Fighter Game</h1>
        <input type="text" id="username" placeholder="Enter your name" value="Player">
        <button id="startGame">Start Game</button>
    </div>

    <script>
        document.getElementById('startGame').addEventListener('click', function() {
            const username = document.getElementById('username').value || 'Player';
            localStorage.setItem('gameUsername', username);
            window.location.href = 'game.html';
        });

        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('startGame').click();
            }
        });
    </script>
</body>
</html>
