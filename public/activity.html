<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky-Warriors 2 | Activity Log & Leaderboard</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="favicon-32x32[1].png">
    <script src="js/config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap');

        :root {
            --cyan: #00ffcc;
            --red: #ff4400;
            --gold: #ffd700;
            --bg: #050510;
            --panel: rgba(0,10,20,0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: #ccc;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(0,255,204,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,204,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes gridScroll { to { background-position: 0 1000px; } }

        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,255,204,0.25);
            padding-bottom: 18px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            color: var(--cyan);
            text-shadow: 0 0 12px var(--cyan);
            text-decoration: none;
        }
        .logo span { color: var(--red); }
        .back-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--cyan); color: #000; }

        /* Two-column layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media(max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        /* Section panels */
        .panel {
            background: var(--panel);
            border: 1px solid rgba(0,255,204,0.2);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,255,204,0.05);
        }
        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: var(--cyan);
            letter-spacing: 3px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(0,255,204,0.25);
        }

        /* Online now strip */
        .online-strip {
            background: rgba(0,255,204,0.05);
            border: 1px solid rgba(0,255,204,0.15);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .online-dot {
            width: 10px; height: 10px;
            background: #22ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #22ff66;
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .online-strip span { color: #aaa; font-size: 13px; }
        .online-strip strong { color: #22ff66; }
        #online-list { color: var(--cyan); font-size: 12px; flex: 1; }

        /* Leaderboard table */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            color: var(--cyan);
            font-size: 11px;
            letter-spacing: 2px;
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,255,204,0.2);
        }
        td {
            padding: 9px 10px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        tr:hover td { background: rgba(0,255,204,0.04); }
        .rank-1 td:first-child { color: #ffd700; }
        .rank-2 td:first-child { color: #c0c0c0; }
        .rank-3 td:first-child { color: #cd7f32; }
        .score-val { color: var(--cyan); font-weight: bold; }

        /* Activity log list */
        .log-list { max-height: 460px; overflow-y: auto; }
        .log-list::-webkit-scrollbar { width: 5px; }
        .log-list::-webkit-scrollbar-track { background: transparent; }
        .log-list::-webkit-scrollbar-thumb { background: rgba(0,255,204,0.3); border-radius: 4px; }

        .log-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 12px;
        }
        .log-icon { font-size: 16px; flex-shrink: 0; }
        .log-body { flex: 1; }
        .log-name { color: #fff; font-weight: bold; }
        .log-detail { color: #666; margin-top: 2px; font-size: 11px; }
        .log-time { color: #444; font-size: 10px; white-space: nowrap; }
        .event-join .log-icon::before { content: '🟢'; }
        .event-leave .log-icon::before { content: '🔴'; }
        .event-join .log-name { color: #22ff66; }
        .event-leave .log-name { color: #ff6655; }

        .empty-msg {
            color: #444;
            font-size: 13px;
            text-align: center;
            padding: 30px 0;
        }

        .refresh-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 16px;
        }
        .refresh-btn {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid rgba(0,255,204,0.3);
            color: var(--cyan);
            font-family: inherit;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(0,255,204,0.1); }
        .last-updated { color: #444; font-size: 10px; align-self: center; }
    </style>
</head>
<body>
<div class="page-wrap">
    <header>
        <a class="logo" href="/">SKY<span>-</span>WARRIORS 2</a>
        <a class="back-btn" href="/">← BACK TO LOBBY</a>
    </header>

    <!-- Online Now Strip -->
    <div class="online-strip">
        <div class="online-dot"></div>
        <span>Online now: <strong id="online-count">…</strong></span>
        <div id="online-list">Loading…</div>
    </div>

    <div class="refresh-bar">
        <span class="last-updated" id="last-updated"></span>
        <button class="refresh-btn" onclick="loadAll()">⟳ REFRESH</button>
    </div>

    <div class="grid">
        <!-- Lifetime Leaderboard -->
        <div class="panel">
            <div class="panel-title">🏆 LIFETIME LEADERBOARD</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>CALLSIGN</th>
                        <th>SCORE</th>
                    </tr>
                </thead>
                <tbody id="lb-body">
                    <tr><td colspan="3" class="empty-msg">Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Activity Log -->
        <div class="panel">
            <div class="panel-title">📋 PLAYER ACTIVITY LOG</div>
            <div class="log-list" id="log-list">
                <div class="empty-msg">Loading…</div>
            </div>
        </div>
    </div>
</div>

<script>
    function formatTime(iso) {
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function formatDate(iso) {
        const d = new Date(iso);
        const today = new Date();
        if (d.toDateString() === today.toDateString()) return 'Today ' + formatTime(iso);
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + formatTime(iso);
    }

    async function loadAll() {
        document.getElementById('last-updated').textContent = 'Updating…';
        await Promise.all([loadLeaderboard(), loadLog(), loadOnline()]);
        document.getElementById('last-updated').textContent = 'Updated ' + formatTime(new Date().toISOString());
    }

    async function loadLeaderboard() {
        try {
            const data = window.GAME_CONFIG ? await GAME_CONFIG.apiFetch('/api/leaderboard') : await fetch('/api/leaderboard').then(r => r.json());
            const tbody = document.getElementById('lb-body');
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">No scores yet. Start playing!</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((p, i) => `
                <tr class="${i < 3 ? 'rank-' + (i+1) : ''}">
                    <td>${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</td>
                    <td>${escHtml(p.username)}</td>
                    <td class="score-val">${p.score}</td>
                </tr>`).join('');
        } catch(e) {
            document.getElementById('lb-body').innerHTML = '<tr><td colspan="3" class="empty-msg">Server offline or no data.</td></tr>';
        }
    }

    async function loadLog() {
        try {
            const data = window.GAME_CONFIG ? await GAME_CONFIG.apiFetch('/api/activity-log') : await fetch('/api/activity-log').then(r => r.json());
            const el = document.getElementById('log-list');
            if (!data.length) {
                el.innerHTML = '<div class="empty-msg">No activity yet. Join a game!</div>';
                return;
            }
            el.innerHTML = data.map(e => `
                <div class="log-item event-${e.event}">
                    <div class="log-icon"></div>
                    <div class="log-body">
                        <div class="log-name">${escHtml(e.username)}</div>
                        <div class="log-detail">${e.event === 'join'
                            ? 'Joined the battle'
                            : `Left after ${e.duration || '—'} · Score: ${e.score ?? 0}`}</div>
                    </div>
                    <div class="log-time">${formatDate(e.time)}</div>
                </div>`).join('');
        } catch(e) {
            document.getElementById('log-list').innerHTML = '<div class="empty-msg">Could not load log.</div>';
        }
    }

    async function loadOnline() {
        try {
            const data = window.GAME_CONFIG ? await GAME_CONFIG.apiFetch('/api/online') : await fetch('/api/online').then(r => r.json());
            document.getElementById('online-count').textContent = data.length;
            document.getElementById('online-list').textContent = data.length
                ? data.map(p => p.username).join(' · ')
                : 'Nobody flying right now.';
        } catch(e) {
            document.getElementById('online-count').textContent = '?';
            document.getElementById('online-list').textContent = 'Server offline';
        }
    }

    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Initial load + auto-refresh every 30s
    loadAll();
    setInterval(loadAll, 30000);
</script>
</body>
</html>
